services:
  db:
    image: docker.io/library/postgres:17-alpine
    networks:
      ai-net:
        aliases:
          - db
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - ai-net
    env_file: .env
    ports:
      - "8085:8080"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - GIN_MODE=release
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - PYTHON_ANALYSIS_API_URL=${PYTHON_ANALYSIS_API_URL}
      - AI_TRAINING_URL=${AI_TRAINING_URL}
      - PASETO_KEY=${PASETO_KEY}
      - PYTHON_TEST_URL=${PYTHON_TEST_URL}
      - PYTHON_REDUCE_DIVERSITY_API_URL=${PYTHON_REDUCE_DIVERSITY_API_URL}
    volumes:
      - ./images:/app/images
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 300s

  surrealdb:
    image: docker.io/surrealdb/surrealdb:latest
    networks:
      - ai-net
    command: start --log trace --user ${SURREALDB_USER:-root} --pass ${SURREALDB_PASS:-root} rocksdb:/data/database.db
    ports:
      - "8005:8000"
    volumes:
      - ./surreal_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-lint:
    image: alpine:latest
    volumes:
      - .:/app
    working_dir: /app
    command: ["sh", "-c", "apk add --no-cache go && go fmt ./... && go vet ./..."]

networks:
  ai-net:
    name: ai-net
    driver: bridge